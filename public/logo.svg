<svg width="200" height="200" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="12" fill="#0a0f1e"/>

  <!-- Outer pulse ring -->
  <circle cx="24" cy="24" r="23" fill="url(#pulseGrad)"/>

  <!-- Outer dashed track ring -->
  <circle cx="24" cy="24" r="21" stroke="#3b82f6" stroke-width="0.75" stroke-opacity="0.35" fill="none" stroke-dasharray="3 2"/>

  <!-- Mid ring -->
  <circle cx="24" cy="24" r="17" stroke="#60a5fa" stroke-width="0.5" stroke-opacity="0.25" fill="none"/>

  <!-- Spokes at 0°, 60°, 120°, 180°, 240°, 300° -->
  <line x1="37" y1="24" x2="44" y2="24" stroke="#60a5fa" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="30.5" y1="35.26" x2="34" y2="41.12" stroke="#60a5fa" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="17.5" y1="35.26" x2="14" y2="41.12" stroke="#60a5fa" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="11" y1="24" x2="4" y2="24" stroke="#60a5fa" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="17.5" y1="12.74" x2="14" y2="6.88" stroke="#60a5fa" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="30.5" y1="12.74" x2="34" y2="6.88" stroke="#60a5fa" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Node dots -->
  <circle cx="44" cy="24" r="1.2" fill="#60a5fa" fill-opacity="0.7"/>
  <circle cx="34" cy="41.12" r="1.2" fill="#60a5fa" fill-opacity="0.7"/>
  <circle cx="14" cy="41.12" r="1.2" fill="#60a5fa" fill-opacity="0.7"/>
  <circle cx="4" cy="24" r="1.2" fill="#60a5fa" fill-opacity="0.7"/>
  <circle cx="14" cy="6.88" r="1.2" fill="#60a5fa" fill-opacity="0.7"/>
  <circle cx="34" cy="6.88" r="1.2" fill="#60a5fa" fill-opacity="0.7"/>

  <!-- Payment pulse arc — top-right highlight -->
  <path d="M 24 3 A 21 21 0 0 1 44.5 17" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" fill="none" filter="url(#glow)" stroke-opacity="0.9"/>

  <!-- Core disc -->
  <circle cx="24" cy="24" r="11" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="24" cy="24" r="11" stroke="#93c5fd" stroke-width="0.5" stroke-opacity="0.6" fill="none"/>

  <!-- Dollar sign -->
  <text x="24" y="28.5" text-anchor="middle" font-size="12" font-weight="700" font-family="system-ui, sans-serif" fill="white" fill-opacity="0.95">$</text>

  <!-- x402 label -->
  <text x="24" y="40" text-anchor="middle" font-size="4" font-weight="600" font-family="monospace" fill="#60a5fa" fill-opacity="0.6" letter-spacing="0.5">x402</text>
</svg>
